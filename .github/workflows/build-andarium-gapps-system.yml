name: Build Andarium GApps system disk

on:
  workflow_dispatch:
    inputs:
      android_release_url:
        description: HTTPS URL of the accepted Android release tar archive
        required: true
        type: string
      android_release_sha256:
        description: SHA-256 of the Android release archive
        required: true
        type: string
      gapps_url:
        description: HTTPS URL of the MindTheGapps 17.0.0 arm64 zip
        required: true
        type: string
      gapps_sha256:
        description: SHA-256 of the MindTheGapps zip
        required: true
        type: string

permissions:
  contents: read

jobs:
  gapps:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Install erofs-utils with zstd
        run: |
          sudo apt-get update
          sudo apt-get install -y autoconf automake libtool pkg-config uuid-dev liblz4-dev libzstd-dev zlib1g-dev attr unzip xz-utils
          git clone --depth 1 --branch v1.8.6 https://git.kernel.org/pub/scm/linux/kernel/git/xiang/erofs-utils.git "$RUNNER_TEMP/erofs-utils"
          cd "$RUNNER_TEMP/erofs-utils"
          ./autogen.sh
          ./configure --with-libzstd --enable-lz4 --prefix=/usr/local
          make -j"$(nproc)"
          sudo make install
          mkfs.erofs --help 2>&1 | head -n 3

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h "$RUNNER_TEMP"

      - name: Download inputs
        env:
          RELEASE_URL: ${{ inputs.android_release_url }}
          RELEASE_SHA256: ${{ inputs.android_release_sha256 }}
          GAPPS_URL: ${{ inputs.gapps_url }}
          GAPPS_SHA256: ${{ inputs.gapps_sha256 }}
        run: |
          curl --fail --location --retry 3 "$RELEASE_URL" --output "$RUNNER_TEMP/release.tar"
          echo "$RELEASE_SHA256  $RUNNER_TEMP/release.tar" | sha256sum -c -
          curl --fail --location --retry 3 "$GAPPS_URL" --output "$RUNNER_TEMP/gapps.zip"
          echo "$GAPPS_SHA256  $RUNNER_TEMP/gapps.zip" | sha256sum -c -

      - name: Build the GApps system disk
        run: Andarium/scripts/build-gapps-system.sh "$RUNNER_TEMP/release.tar" "$RUNNER_TEMP/gapps.zip" "$RUNNER_TEMP/out"

      - uses: actions/upload-artifact@v4
        with:
          name: Andarium-GApps-system
          path: ${{ runner.temp }}/out/
          compression-level: 0
