# SPDX-License-Identifier: GPL-2.0-or-later
#
# Build and check Kernarium on GitHub-hosted Apple silicon runners.
#
# The order is the dependency order, so nothing expensive runs before a cheap
# check can fail:
#
#   audit           repository policy checks; needs only Python and Git
#   tooling         the tooling CTest suite; needs no dependency prefix
#   swift-packages  GuestHostCore and AndariumCore, the app's model, on the host
#   ios-app         AndariumPreview for the iOS Simulator: a real app build
#   dependencies    dependencies/prepare.sh + build.sh into the private prefixes
#   unit            the unit CTest suite, on the macOS prefix
#   gpu-unit        the GPU ownership tests, on both prefixes
#   andarium-app    the full Andarium application; off until the repository can
#                   hand this job a packaged runtime and a staged system image
#
# `ios-app` is the app build that works today: AndariumPreview is compiled from
# Andarium/Shared and Andarium/Preview alone, imports no runtime framework, has
# no .build input and runs no script phase (Andarium/README.md). The full
# `Andarium` and `Kernarium` targets embed XCFrameworks that this repository
# builds from source and a system image staged from an accepted Android
# release; see docs/ci.md for what each one still needs.
#
# check-integration is deliberately absent. It needs a guest rootfs image
# (UML_INTEGRATION_ROOTFS) that this workflow does not build, and it boots a
# guest, so it belongs on a self-hosted Mac rather than a 3-core runner.

name: Build

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Targets link only the verified private prefixes; no Homebrew library may
  # leak in. These settings only keep brew fast and quiet.
  HOMEBREW_NO_AUTO_UPDATE: "1"
  HOMEBREW_NO_INSTALL_CLEANUP: "1"
  HOMEBREW_NO_ANALYTICS: "1"

jobs:
  audit:
    name: Repository audit
    runs-on: xcode-27
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # Tooling tests commit fixtures as whoever Git resolves, and patch export
      # refuses a placeholder or host-derived address, so the identity has to
      # look like a person's. It never becomes a topic author: a contributor's
      # commit keeps its own author.
      - name: Configure Git identity
        run: |
          git config user.name  "Kernarium CI"
          git config user.email "kernarium-ci@kernarium.dev"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # The runners ship CMake and Ninja already; the dependency recipes need
      # the autotools to build GLib and friends, which come later.
      - name: Install host tools
        run: |
          brew install ninja meson pkg-config rsync autoconf automake gettext \
            libtool gperf groff

      - name: Record the Apple SDK in use
        run: |
          xcodebuild -version
          xcrun --show-sdk-path
          xcrun --show-sdk-version

      # The same checks the tooling suite runs, reached in seconds and without
      # a configure: they catch the mistakes a pull request most often makes.
      - name: Repository file policies
        run: |
          tests/tooling/cmake/check_license_headers.py --source-root .
          tests/tooling/cmake/check_environment_portability.py --source-root .
          tests/tooling/cmake/validate_json_inputs.py --source-root .
          tests/tooling/cmake/check_adb_server_policy.py --source-root .

  tooling:
    name: Tooling checks
    needs: audit
    runs-on: xcode-27
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Configure Git identity
        run: |
          git config user.name  "Kernarium CI"
          git config user.email "kernarium-ci@kernarium.dev"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install host tools
        run: |
          brew install ninja meson pkg-config rsync autoconf automake gettext \
            libtool gperf groff

      - name: Configure
        run: cmake --preset macos-tooling -DPython3_EXECUTABLE="$(command -v python3)"

      - name: Build test binaries
        run: cmake --build --preset tooling-test-binaries --parallel

      - name: Run tooling tests
        run: ctest --preset tooling

      - name: Test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tooling-test-log
          path: .build/presets/macos-tooling/Testing/**/LastTest.log
          if-no-files-found: ignore
          retention-days: 7

  swift-packages:
    name: Swift packages
    needs: audit
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        # Both packages declare macOS 27.0 as their floor, so the toolchain has
        # to be the one the runners ship as Xcode 27, not macos-26's default.
        run: |
          xcodebuild -version
          xcrun --sdk macosx --show-sdk-version

      # These are the commands the CMake suite registers as `guest-host-core`
      # and `andarium-core` (tests/unit/guesthost, tests/unit/andarium), run
      # the same way: same scratch paths, so a local and a CI run agree.
      - name: Test GuestHostCore
        run: |
          xcrun swift test \
            --package-path GuestHost/Core \
            --scratch-path .build/guest-host-core-swiftpm

      - name: Test AndariumCore
        run: |
          xcrun swift test \
            --package-path Andarium/AndariumCore \
            --scratch-path .build/andarium-core-swiftpm

  ios-app:
    name: Andarium preview app
    needs: swift-packages
    runs-on: xcode-27
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      # AndariumPreview builds over Andarium/Shared and Andarium/Preview with
      # state from AndariumCore; it embeds no runtime, boots nothing and has no
      # script phase, which is why it needs none of the .build inputs the
      # `Andarium` target does.
      - name: Configure the project
        run: |
          xcodebuild -project Andarium/Andarium.xcodeproj \
            -scheme AndariumPreview \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath .build/andarium-preview-dd \
            build
        # The scheme needs no signing identity on a Simulator destination, so a
        # fork's pull request builds it without a secret.
        env:
          # A generic Simulator destination may offer x86_64; no product here is
          # built for it (docs/testing.md#apple-builds-and-kernarium).
          EXCLUDED_ARCHS: x86_64

      - name: Note the product
        run: |
          APP=.build/andarium-preview-dd/Build/Products/Debug-iphonesimulator/AndariumPreview.app
          test -d "$APP"
          du -sh "$APP"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist"

      - name: Upload the app
        uses: actions/upload-artifact@v4
        with:
          name: AndariumPreview-simulator
          path: .build/andarium-preview-dd/Build/Products/Debug-iphonesimulator/AndariumPreview.app
          retention-days: 7

      - name: Build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: andarium-preview-log
          path: .build/andarium-preview-dd/Logs/Build/*.xcactivitylog
          if-no-files-found: ignore
          retention-days: 7

  dependencies:
    name: Dependency prefixes
    needs: audit
    # The Apple GPU prefix is a Mesa, virglrenderer and LLVM build; it needs the
    # larger runner's cores and disk, and it is the slowest thing in the
    # repository. Nothing else here is worth splitting off: one prefix build
    # serves both test jobs.
    runs-on: xcode-27-xlarge
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - name: Configure Git identity
        run: |
          git config user.name  "Kernarium CI"
          git config user.email "kernarium-ci@kernarium.dev"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # The GPU recipe prefers Meson, Mako and PyYAML from .build/gpu-tools-venv
      # when it exists; these are the PATH fallbacks for when it does not.
      - name: Install host tools
        run: |
          brew install ninja meson mako pyyaml pkg-config rsync autoconf \
            automake gettext libtool gperf groff cmake

      - name: Metal toolchain
        run: xcodebuild -downloadComponent MetalToolchain

      # The key hashes the inputs a prefix receipt records. hashFiles is only
      # allowed in a step, not in the workflow's env, so the expression is
      # repeated where it is used rather than named once.
      - name: Restore prefixes
        id: prefixes
        uses: actions/cache/restore@v4
        with:
          path: |
            .build/dependencies/macos-arm64-27
            .build/dependencies/apple-gpu-vulkan-experiment/macos-arm64
          key: prefixes-${{ hashFiles('dependencies/manifest.tsv', 'dependencies/patches/**/series.tsv', 'dependencies/platforms/**', 'dependencies/build.sh', 'dependencies/build-apple-gpu.sh') }}
          restore-keys: prefixes-

      - name: Verify restored prefixes
        id: verify
        if: steps.prefixes.outputs.cache-hit != ''
        # A restore-key hit is a prefix built from other inputs: it must not be
        # used, or the test jobs would build against the wrong libraries.
        env:
          RESTORED_KEY: ${{ steps.prefixes.outputs.cache-matched-key }}
          WANTED_KEY: ${{ steps.prefixes.outputs.cache-primary-key }}
        run: |
          if [ "$RESTORED_KEY" != "$WANTED_KEY" ]; then
            echo "restored $RESTORED_KEY, want $WANTED_KEY: rebuilding"
            rm -rf .build/dependencies/macos-arm64-27 \
                   .build/dependencies/apple-gpu-vulkan-experiment/macos-arm64
            echo "usable=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # The receipts, the manifest rows and the patched source trees the
          # prefix records have to match this checkout, and the prefix itself
          # has to hold no build-host path.
          dependencies/prepare.sh --product macos --verify
          dependencies/verify-prefix.sh \
            --prefix .build/dependencies/macos-arm64-27 \
            --manifest dependencies/manifest.tsv \
            --deployment-target 27.0
          dependencies/build-apple-gpu.sh \
            --product apple-gpu-vulkan-experiment --platform macos --verify-only
          echo "usable=true" >> "$GITHUB_OUTPUT"

      # prepare.sh is the only dependency step allowed to touch the network.
      - name: Prepare sources
        if: steps.verify.outputs.usable != 'true'
        run: |
          dependencies/prepare.sh --product macos
          dependencies/prepare.sh --product apple-gpu-vulkan-experiment

      - name: Build macOS dependencies
        if: steps.verify.outputs.usable != 'true'
        run: dependencies/build.sh --jobs "$(sysctl -n hw.ncpu)"

      # The product is named first: --platform alone leaves it to a default.
      - name: Build Apple GPU dependencies
        if: steps.verify.outputs.usable != 'true'
        run: >-
          dependencies/build-apple-gpu.sh
          --product apple-gpu-vulkan-experiment
          --platform macos
          --jobs "$(sysctl -n hw.ncpu)"

      - name: Save prefixes
        # Only a prefix this run built or repaired; an exact hit is already saved.
        if: steps.verify.outputs.usable != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            .build/dependencies/macos-arm64-27
            .build/dependencies/apple-gpu-vulkan-experiment/macos-arm64
          key: prefixes-${{ hashFiles('dependencies/manifest.tsv', 'dependencies/patches/**/series.tsv', 'dependencies/platforms/**', 'dependencies/build.sh', 'dependencies/build-apple-gpu.sh') }}

  unit:
    name: Unit tests
    needs: dependencies
    runs-on: xcode-27-xlarge
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - name: Configure Git identity
        run: |
          git config user.name  "Kernarium CI"
          git config user.email "kernarium-ci@kernarium.dev"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install host tools
        run: |
          brew install ninja meson pkg-config rsync autoconf automake gettext \
            libtool gperf groff

      - name: Restore prefixes
        uses: actions/cache/restore@v4
        with:
          path: |
            .build/dependencies/macos-arm64-27
            .build/dependencies/apple-gpu-vulkan-experiment/macos-arm64
          key: prefixes-${{ hashFiles('dependencies/manifest.tsv', 'dependencies/patches/**/series.tsv', 'dependencies/platforms/**', 'dependencies/build.sh', 'dependencies/build-apple-gpu.sh') }}
          fail-on-cache-miss: true

      - name: Configure
        run: cmake --preset macos-unit -DPython3_EXECUTABLE="$(command -v python3)"

      - name: Build test binaries
        run: cmake --build --preset unit-test-binaries --parallel "$(sysctl -n hw.ncpu)"

      - name: Run unit tests
        run: ctest --preset unit

      - name: Test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-log
          path: .build/presets/macos-unit/Testing/**/LastTest.log
          if-no-files-found: ignore
          retention-days: 7

  gpu-unit:
    name: GPU ownership tests
    needs: dependencies
    runs-on: xcode-27-xlarge
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Configure Git identity
        run: |
          git config user.name  "Kernarium CI"
          git config user.email "kernarium-ci@kernarium.dev"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install host tools
        run: |
          brew install ninja meson pkg-config rsync autoconf automake gettext \
            libtool gperf groff

      - name: Metal toolchain
        run: xcodebuild -downloadComponent MetalToolchain

      - name: Restore prefixes
        uses: actions/cache/restore@v4
        with:
          path: |
            .build/dependencies/macos-arm64-27
            .build/dependencies/apple-gpu-vulkan-experiment/macos-arm64
          key: prefixes-${{ hashFiles('dependencies/manifest.tsv', 'dependencies/patches/**/series.tsv', 'dependencies/platforms/**', 'dependencies/build.sh', 'dependencies/build-apple-gpu.sh') }}
          fail-on-cache-miss: true

      - name: Configure
        run: cmake --preset macos-unit-gpu -DPython3_EXECUTABLE="$(command -v python3)"

      - name: Build test binaries
        run: cmake --build --preset gpu-unit-test-binaries --parallel "$(sysctl -n hw.ncpu)"

      - name: Run GPU tests
        run: ctest --preset unit-gpu

      - name: Test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gpu-test-log
          path: .build/presets/macos-unit-gpu/Testing/**/LastTest.log
          if-no-files-found: ignore
          retention-days: 7

  andarium-app:
    name: Andarium application
    needs: dependencies
    # Off by default. Turn it on with the repository variable
    # KERNARIUM_APP_BUILDS=true once the runner can hand the project what the
    # target embeds; docs/ci.md#the-full-applications lists the six inputs and
    # the two ways to get them.
    if: vars.KERNARIUM_APP_BUILDS == 'true'
    # A packaged device build needs a signing identity, and only a self-hosted
    # Mac can hold one this workflow may use. Point this label at that machine;
    # the stock hosted runners have no team and would stop at "requires a
    # development team".
    runs-on: [self-hosted, macOS, arm64, kernarium-ios]
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - name: Package the Android runtime
        run: |
          cmake --preset kernarium-ios-device-android \
            -DPython3_EXECUTABLE="$(command -v python3)"
          cmake --build --preset kernarium-ios-device-android --parallel
          Kernarium/scripts/package-ios-frameworks.sh --runtimes android

      # The staged image is a copy of an accepted Android release. A release
      # build costs hours and tens of gigabytes, so the machine this job runs on
      # keeps them in .build/android/releases; the script checks the release it
      # stages against the manifest and layout the acceptance names.
      - name: Stage the system image
        run: Andarium/scripts/stage-system-image.py

      - name: Build the application
        run: |
          xcodebuild -project Andarium/Andarium.xcodeproj \
            -scheme Andarium \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath .build/andarium-dd \
            -allowProvisioningUpdates \
            build

      - name: Upload the app
        uses: actions/upload-artifact@v4
        with:
          name: Andarium-ios
          path: .build/andarium-dd/Build/Products/Release-iphoneos/Andarium.app
          retention-days: 7
