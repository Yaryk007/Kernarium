name: Validate StikDebug JIT port

on:
  push:
    branches:
      - codex/stikdebug-ios-jit
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile-allocator:
    runs-on: xcode-27
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Validate project metadata
        run: |
          cmake --list-presets
          sh -n Kernarium/scripts/package-ios-frameworks.sh
          plutil -lint Andarium/Config/Andarium.StikDebug.entitlements

      - name: Compile iOS 27 executable-memory owner
        run: |
          mkdir -p .build/jit-source-check
          xcrun --sdk iphoneos clang++ \
            -std=c++20 \
            -Wall -Wextra -Werror \
            -target arm64-apple-ios27.0 \
            -DUML_ENABLE_IOS_STIKDEBUG_JIT=1 \
            -Idarwin/cpu/jit_memory \
            -c darwin/cpu/jit_memory/executable_memory.cpp \
            -o .build/jit-source-check/executable_memory.o
          xcrun --sdk iphoneos clang++ \
            -std=c++20 \
            -Wall -Wextra -Werror \
            -target arm64-apple-ios27.0 \
            -DUML_ENABLE_IOS_STIKDEBUG_JIT=1 \
            -Idarwin \
            -c darwin/cpu/arm64/jit/jit_arena.cpp \
            -o .build/jit-source-check/jit_arena.o
