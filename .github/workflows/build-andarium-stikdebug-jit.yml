# SPDX-License-Identifier: GPL-2.0-or-later
name: Build Andarium StikDebug JIT IPA

on:
  push:
    branches: [merge-official-andarium]
  workflow_dispatch:
    inputs:
      build_number:
        description: Andarium build number
        default: "31"
        type: string
      kernel_artifact_url:
        description: HTTPS URL of the accepted Android kernel artifact tar archive
        required: true
        type: string
      kernel_artifact_sha256:
        description: SHA-256 of the Android kernel artifact archive
        required: true
        type: string

permissions:
  contents: read

jobs:
  unsigned-ipa:
    name: Unsigned Andarium IPA
    runs-on: xcode-27
    timeout-minutes: 355
    env:
      DERIVED_DATA: ${{ github.workspace }}/.build/andarium-device-derived
      KERNARIUM_XCFRAMEWORK_OUTPUT: ${{ github.workspace }}/.build/kernarium-xcframeworks
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install host tools
        run: |
          python -m pip install meson mako packaging PyYAML
          brew install ninja pkg-config rsync autoconf \
            automake gettext libtool gperf groff cmake

      - name: Install the Metal toolchain
        run: xcodebuild -downloadComponent MetalToolchain

      - name: Verify build tools
        run: |
          xcodebuild -version
          cmake --version
          ninja --version
          python3 --version

      - name: Restore pinned dependency builds
        id: dependencies-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            external/sources
            .build/dependency-cache
            .build/dependencies
          key: andarium-ios27-${{ runner.os }}-${{ hashFiles('dependencies/manifest.tsv', 'dependencies/platforms/**', 'dependencies/patches/**') }}
          restore-keys: |
            andarium-ios27-${{ runner.os }}-

      - name: Fetch accepted Android kernel
        env:
          KERNEL_URL: ${{ inputs.kernel_artifact_url || 'https://github.com/imxieyi/Kernarium/releases/download/andarium-1.1/android-6.18-arm64-4k-20261119-6.18.60-ca1.tar.gz' }}
          KERNEL_SHA256: ${{ inputs.kernel_artifact_sha256 || '128d0948d6989e7d1cd03edc5f1c1218d0dd2fac99c7bb960897c64019e38196' }}
        run: |
          mkdir -p .build/kernel/artifacts
          curl --fail --location --retry 3 "$KERNEL_URL" --output "$RUNNER_TEMP/andarium-kernel.tar"
          printf '%s  %s\n' "$KERNEL_SHA256" "$RUNNER_TEMP/andarium-kernel.tar" | shasum -a 256 --check
          tar -xf "$RUNNER_TEMP/andarium-kernel.tar" -C .build/kernel/artifacts

      - name: Prepare pinned dependency sources
        run: |
          dependencies/prepare.sh --validate-manifest-only
          dependencies/prepare.sh --product apple-gpu-vulkan-experiment
          dependencies/prepare.sh --product ios-storage
          dependencies/prepare.sh --product ios-compression
          dependencies/prepare.sh --product ios-network

      - name: Build iOS dependencies
        run: |
          dependencies/build-ios-storage.sh
          dependencies/build-ios-zstd.sh
          dependencies/build-ios-network.sh --platform ios
          dependencies/build-apple-gpu.sh --platform ios --jobs "$(sysctl -n hw.ncpu)"

      - name: Save pinned dependency builds
        if: steps.dependencies-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            external/sources
            .build/dependency-cache
            .build/dependencies
          key: ${{ steps.dependencies-cache.outputs.cache-primary-key }}

      - name: Build the Android runtime
        run: |
          cmake --preset kernarium-ios-device-android -DUML_AOT_MODE=OFF
          cmake --build --preset kernarium-ios-device-android --parallel "$(sysctl -n hw.ncpu)"
          Kernarium/scripts/package-ios-frameworks.sh --sdk device --runtimes android

      - name: Build Andarium without signing
        env:
          BUILD_NUMBER: ${{ inputs.build_number || '31' }}
        run: |
          xcodebuild build \
            -project Andarium/Andarium.xcodeproj \
            -scheme Andarium \
            -destination 'generic/platform=iOS' \
            -configuration Release \
            -derivedDataPath "$DERIVED_DATA" \
            -jobs "$(sysctl -n hw.ncpu)" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            CODE_SIGNING_ALLOWED=NO

      - name: Package unsigned IPA
        run: |
          test ! -e "$DERIVED_DATA/Build/Products/Release-iphoneos/Andarium.app/andarium-system"
          mkdir -p "$RUNNER_TEMP/andarium-ipa/Payload"
          cp -R "$DERIVED_DATA/Build/Products/Release-iphoneos/Andarium.app" \
            "$RUNNER_TEMP/andarium-ipa/Payload/Andarium.app"
          ditto -c -k --keepParent \
            "$RUNNER_TEMP/andarium-ipa/Payload" \
            "$GITHUB_WORKSPACE/Andarium-StikDebug-JIT-unsigned.ipa"

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: Andarium-StikDebug-JIT-unsigned
          path: |
            Andarium-StikDebug-JIT-unsigned.ipa
            Andarium/Config/Andarium.StikDebug.entitlements
          if-no-files-found: error
          retention-days: 14
